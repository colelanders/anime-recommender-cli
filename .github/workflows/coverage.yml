name: Code Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails if line coverage is below the threshold in vitest.config.ts.
      - name: Run tests with coverage
        run: npm run test:coverage
